<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ $json.nom_entreprise }} | Maçonnerie 3D</title>
    
    <!-- Importation des librairies de base -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <!-- NOUVEAU : Importation pour le Post-Processing (Effets de caméra) -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #D38B5D; 
            --bg-color: #020202; /* Assombri pour faire ressortir le Bloom */
            --text-light: #F5F5F7;
            --glass-bg: rgba(10, 10, 10, 0.4); /* Plus transparent pour voir la 3D */
            --glass-border: rgba(255, 255, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html {
            background-color: var(--bg-color);
            font-family: 'Montserrat', sans-serif;
            color: var(--text-light);
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        #webgl-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 0;
            pointer-events: none; 
        }

        .content-wrapper { position: relative; z-index: 10; width: 100%; }

        section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 100px 10vw;
            perspective: 1200px;
        }

        .hero { justify-content: flex-start; }
        .services { justify-content: flex-end; }
        .about { justify-content: flex-start; }
        .reviews { justify-content: flex-end; }
        .contact { justify-content: center; text-align: center; }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 60px;
            border-radius: 8px;
            max-width: 650px;
            box-shadow: 0 40px 80px rgba(0,0,0,0.8);
            transform-style: preserve-3d;
            will-change: transform;
            position: relative;
            overflow: hidden;
        }

        /* Effet de brillance subtil sur les panneaux */
        .glass-panel::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.03), transparent);
            transform: skewX(-20deg);
            animation: shine 8s infinite;
        }

        @keyframes shine {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        .kicker { color: var(--primary); text-transform: uppercase; letter-spacing: 0.3em; font-size: 0.75rem; font-weight: 600; margin-bottom: 1.5rem; display: block; }
        h1, h2 { font-family: 'Cinzel', serif; line-height: 1.1; margin-bottom: 1.5rem; font-weight: 700; text-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        h1 { font-size: clamp(3rem, 6vw, 5rem); }
        h2 { font-size: clamp(2.2rem, 4.5vw, 3.5rem); }
        p { font-size: 1.05rem; line-height: 1.8; color: #9a9a9a; margin-bottom: 2rem; }

        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 18px 42px; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.15em;
            cursor: pointer; transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            text-decoration: none; border-radius: 4px;
            position: relative; overflow: hidden;
        }

        .btn-primary {
            background-color: var(--primary);
            color: #000;
            box-shadow: 0 0 20px rgba(211, 139, 93, 0.2);
        }

        .btn-primary:hover {
            box-shadow: 0 0 40px rgba(211, 139, 93, 0.6);
            transform: translateY(-2px);
            background-color: #e59a68;
        }

        @media(max-width: 992px) {
            section { padding: 80px 24px; justify-content: center !important; }
            .glass-panel { padding: 40px 24px; width: 100%; }
        }
    </style>
</head>
<body>

    <canvas id="webgl-canvas"></canvas>

    <main class="content-wrapper">
        <section class="hero">
            <div class="glass-panel">
                <span class="kicker">Expertise & Précision</span>
                <h1>L'Art de<br>Bâtir</h1>
                <p>Découvrez notre savoir-faire en maçonnerie générale. Une fondation solide pour vos projets les plus ambitieux.</p>
                <a href="#contact" class="btn btn-primary">Demander un devis</a>
            </div>
        </section>
        
        <!-- Les autres sections restent identiques à ton code, je les masque ici pour la lisibilité -->
        <section class="services"><div class="glass-panel"><h2>Nos Services</h2><p>Le mur se construit...</p></div></section>
        <section class="about"><div class="glass-panel"><h2>Notre Histoire</h2><p>Le mur prend forme...</p></div></section>
        <section class="contact"><div class="glass-panel"><h2>Prêt à bâtir ?</h2><p>Le mur est terminé.</p></div></section>
    </main>

    <script>
        // --- 1. INITIALISATION ---
        const canvas = document.querySelector('#webgl-canvas');
        const scene = new THREE.Scene();
        
        // Brouillard plus dense pour fondre les bords
        scene.fog = new THREE.FogExp2(0x020202, 0.035);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 35); // Caméra légèrement plus reculée au départ

        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: false }); // Antialias false pour les performances du Post-Processing
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping; // Rendu des couleurs cinématographique
        renderer.toneMappingExposure = 1.2;

        // --- 2. POST-PROCESSING (LE SECRET DU RENDU "PRO") ---
        const renderScene = new THREE.RenderPass(scene, camera);
        
        // UnrealBloomPass crée cet effet de halo lumineux sur les parties éclairées
        // Paramètres : résolution, intensité, rayon, seuil de luminosité
        const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.threshold = 0.2;
        bloomPass.strength = 1.2; // Puissance du halo
        bloomPass.radius = 0.5;

        const composer = new THREE.EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // --- 3. LUMIÈRES DRAMATIQUES ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.2); // Très faible
        scene.add(ambientLight);

        // Spot chaud principal (imite une lampe de chantier ou un soleil rasant)
        const spotLight = new THREE.SpotLight(0xffaa55, 500);
        spotLight.position.set(15, 20, 20);
        spotLight.angle = Math.PI / 4;
        spotLight.penumbra = 0.8; // Bord doux
        scene.add(spotLight);

        // Lumière froide en opposition pour détacher les volumes
        const coolLight = new THREE.PointLight(0x4A6B8C, 300, 100); 
        coolLight.position.set(-20, -10, 15);
        scene.add(coolLight);

        // --- 4. PARTICULES DE POUSSIÈRE (ATMOSPHÈRE) ---
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 800; // Nombre de grains de poussière
        const posArray = new Float32Array(particlesCount * 3);

        for(let i = 0; i < particlesCount * 3; i++) {
            // Répartition dans un cube autour de la scène
            posArray[i] = (Math.random() - 0.5) * 80;
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.05,
            color: 0xd38b5d,
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending
        });
        
        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);

        // --- 5. MATÉRIAUX ET MUR (Optimisé) ---
        const textureLoader = new THREE.TextureLoader();
        const texturePath = 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/textures/';
        
        const diffuseMap = textureLoader.load(texturePath + 'brick_diffuse.jpg');
        const bumpMap = textureLoader.load(texturePath + 'brick_bump.jpg');
        const roughnessMap = textureLoader.load(texturePath + 'brick_roughness.jpg');

        const brickMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xaa5533,
            map: diffuseMap,
            bumpMap: bumpMap,
            bumpScale: 0.08, // Relief accentué
            roughnessMap: roughnessMap,
            roughness: 0.8,
        });

        const brickGroup = new THREE.Group();
        scene.add(brickGroup);

        const brickWidth = 2, brickHeight = 0.8, brickDepth = 1, mortarGap = 0.1;
        const rows = 12, cols = 16;
        const bricks = [];

        // Création du mur comme dans ton code, avec une dispersion initiale plus large
        for (let row = 0; row < rows; row++) {
            const offset = (row % 2 === 0) ? 0 : (brickWidth + mortarGap) / 2;
            for (let col = 0; col < cols; col++) {
                const geometry = new THREE.BoxGeometry(brickWidth, brickHeight, brickDepth);
                const brick = new THREE.Mesh(geometry, brickMaterial);

                const targetX = (col * (brickWidth + mortarGap)) - ((cols * brickWidth) / 2) + offset;
                const targetY = (row * (brickHeight + mortarGap)) - ((rows * brickHeight) / 2);
                const targetZ = (Math.random() * 0.4) - 0.2; 

                brick.userData = { targetX, targetY, targetZ };

                // Départ chaotique plus lointain
                brick.position.set(
                    targetX + (Math.random() - 0.5) * 80, 
                    targetY - 30 - Math.random() * 50, 
                    targetZ + (Math.random() - 0.5) * 80
                );
                
                brick.rotation.set(Math.random() * 5, Math.random() * 5, Math.random() * 5);
                brick.scale.set(0.01, 0.01, 0.01); 

                brickGroup.add(brick);
                bricks.push(brick);
            }
        }

        // --- 6. ANIMATIONS GSAP ---
        gsap.registerPlugin(ScrollTrigger);

        bricks.sort((a, b) => a.userData.targetY - b.userData.targetY);

        const tl = gsap.timeline({
            scrollTrigger: {
                trigger: "body",
                start: "top top",
                end: "bottom bottom",
                scrub: 1.5, // Adoucit le scrub pour plus de fluidité
            }
        });

        // Construction du mur
        tl.to(bricks.map(b => b.position), {
            x: (i) => bricks[i].userData.targetX,
            y: (i) => bricks[i].userData.targetY,
            z: (i) => bricks[i].userData.targetZ,
            ease: "power2.inOut",
            stagger: 0.015
        }, 0);

        tl.to(bricks.map(b => b.rotation), { x: 0, y: 0, z: 0, ease: "power2.inOut", stagger: 0.015 }, 0);
        tl.to(bricks.map(b => b.scale), { x: 1, y: 1, z: 1, ease: "power2.inOut", stagger: 0.015 }, 0);

        // Mouvement cinématique de la caméra : elle s'approche puis recule légèrement
        tl.to(camera.position, { z: 15, ease: "power1.inOut" }, 0);
        tl.to(camera.position, { z: 28, ease: "power1.inOut" }, 0.5);

        // UI Animation
        gsap.utils.toArray('.glass-panel').forEach((panel, index) => {
            gsap.from(panel, {
                scrollTrigger: { trigger: panel.closest('section'), start: "top 75%", end: "center center", scrub: 1 },
                z: -200, opacity: 0, rotationY: index % 2 === 0 ? 10 : -10, y: 50, ease: "power1.out"
            });
        });

        // --- 7. INTERACTIVITÉ & BOUCLE ---
        let mouseX = 0; let mouseY = 0;
        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // Poussière flottante
            particlesMesh.rotation.y = time * 0.05;
            particlesMesh.position.y = Math.sin(time * 0.2) * 2;

            // Parallax subtil du mur
            brickGroup.rotation.y += (mouseX * 0.1 - brickGroup.rotation.y) * 0.02;
            brickGroup.rotation.x += (-mouseY * 0.1 - brickGroup.rotation.x) * 0.02;

            // Mouvement de la lumière pour donner de la vie au matériau
            spotLight.position.x = Math.sin(time * 0.5) * 10 + 15;

            // On utilise composer.render() au lieu de renderer.render() pour activer le Post-Processing
            composer.render();
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
