<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Hub de Prospection</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-8 min-h-screen">
    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-lg p-8 border border-slate-100">
        <h1 class="text-3xl font-bold text-slate-800 mb-2">🎯 Hub de Prospection</h1>
        <p class="text-slate-500 mb-8 pb-4 border-b border-slate-100">Sites vitrines générés automatiquement.</p>
        
        <ul id="liste-prospects" class="space-y-4">
            <li class="text-slate-500 animate-pulse">Recherche des maquettes en profondeur sur GitHub...</li>
        </ul>
    </div>

    <script>
        // Paramètres de votre dépôt
        const owner = 'kamzerr';
        const repo = 'testoooo';
        const branch = 'main'; // La branche principale de votre dépôt

        // Appel à l'API Git Trees avec recursive=1 pour scanner TOUS les sous-dossiers
        fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/${branch}?recursive=1`)
            .then(response => response.json())
            .then(data => {
                const liste = document.getElementById('liste-prospects');
                liste.innerHTML = ''; // On efface le message de chargement

                // Sécurité si le dépôt est vide ou l'API inaccessible
                if (!data.tree) {
                    liste.innerHTML = '<li class="text-slate-500">Erreur lors de la lecture du dépôt ou dépôt vide.</li>';
                    return;
                }

                // On filtre pour trouver UNIQUEMENT les fichiers "index.html" situés dans "prospects/"
                const fichiersIndex = data.tree.filter(item => 
                    item.type === 'blob' && 
                    item.path.startsWith('prospects/') && 
                    item.path.endsWith('/index.html')
                );

                if (fichiersIndex.length === 0) {
                    liste.innerHTML = '<li class="text-slate-500">Aucune maquette générée pour le moment.</li>';
                    return;
                }

                fichiersIndex.forEach(file => {
                    // file.path ressemble à "prospects/dossier-prospect/v1/index.html"
                    
                    // 1. On retire le début "prospects/" et la fin "/index.html"
                    let cheminRelatif = file.path.replace('prospects/', '').replace('/index.html', '');
                    
                    // 2. On formate : "dossier-prospect/v1" devient "Dossier Prospect • V1"
                    let nomAffichage = cheminRelatif
                        .replace(/\//g, ' • ') // Remplace les slashs par des puces
                        .replace(/-/g, ' ')    // Remplace les tirets par des espaces
                        .replace(/\b\w/g, l => l.toUpperCase()); // Met les premières lettres en majuscules

                    const li = document.createElement('li');
                    li.className = 'p-4 bg-white border border-slate-200 rounded-lg flex justify-between items-center hover:shadow-md transition';
                    
                    // On utilise file.path directement pour le lien car il contient déjà le chemin complet depuis la racine
                    li.innerHTML = `
                        <span class="font-semibold text-slate-800">${nomAffichage}</span>
                        <a href="${file.path}" target="_blank" class="bg-blue-50 text-blue-600 px-4 py-2 rounded font-medium hover:bg-blue-600 hover:text-white transition">Voir le site</a>
                    `;
                    liste.appendChild(li);
                });
            })
            .catch(error => {
                document.getElementById('liste-prospects').innerHTML = '<li class="text-red-500 p-4 bg-red-50 rounded-lg">Erreur : Impossible de se connecter à GitHub.</li>';
                console.error('Erreur API GitHub:', error);
            });
    </script>
</body>
</html>
